server:
  port: ${PORT:8080}

spring:
  application:
    name: ecommerce-backend
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

app:
  jwt:
    secret: ${JWT_SECRET:supersecretkeythatshouldbelongandsecureforjwttokengeneration1234567890}
    # 15 minutes (in milliseconds)
    accessTokenExpirationMs: ${JWT_ACCESS_EXPIRATION:900000}
    # 7 days (in milliseconds)
    refreshTokenExpirationMs: ${JWT_REFRESH_EXPIRATION:604800000}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  show-actuator: false
